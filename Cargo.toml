[workspace]
members = ["crates/rmcp-codemode", "crates/rmcp-codemode-quickjs", "examples/codemode-demo"]
resolver = "3"

[workspace.dependencies]
rmcp-codemode = { version = "0.2.0", path = "./crates/rmcp-codemode" }

[workspace.package]
edition = "2024"
rust-version = "1.88"
version = "0.2.0"
authors = ["G36maid"]
license = "Apache-2.0"
repository = "https://github.com/G36maid/rmcp-codemode"
description = "Code mode for RMCP: expose upstream MCP tools to any host as a codemode script tool"
keywords = ["mcp", "rmcp", "codemode", "sandbox", "llm"]
categories = ["network-programming", "asynchronous"]

[workspace.lints.clippy]
exhaustive_structs = "warn"
exhaustive_enums = "warn"

[profile.release]
lto = "thin"
