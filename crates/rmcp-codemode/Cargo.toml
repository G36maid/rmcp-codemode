[package]
name = "rmcp-codemode"
description = "The engine-agnostic codemode core: tool space, script contract, catalog, and engine traits"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
rmcp = { version = "3.9", default-features = false, features = ["client", "server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
