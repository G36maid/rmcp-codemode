[package]
name = "rmcp-codemode-quickjs"
description = "QuickJS engine for rmcp-codemode: sandbox, suspending runs, approval replay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
rmcp = { version = "3.9", default-features = false, features = ["client", "server"] }
rmcp-codemode = { workspace = true }
rquickjs = { version = "0.14", features = ["futures", "rust-alloc", "parallel"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
futures = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[lints]
workspace = true
